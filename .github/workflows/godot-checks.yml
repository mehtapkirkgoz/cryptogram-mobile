name: Godot checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Puzzle logic tests
        run: godot --headless --path . --script tests/test_puzzle.gd
      - name: UI smoke tests
        run: godot --headless --path . tests/test_ui.tscn
